name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Falha aqui = nada é publicado e o deploy anterior continua no ar.
      # O token só existe neste passo (sem prefixo VITE_): o build do cliente nunca o recebe.
      # Sem o secret UNIVERSE_TOKEN, usa o token automático do Actions, que lê os dados públicos do perfil.
      - run: pnpm snapshot
        env:
          UNIVERSE_TOKEN: ${{ secrets.UNIVERSE_TOKEN || github.token }}
          UNIVERSE_LOGIN: ${{ github.repository_owner }}
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
